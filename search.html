<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>UniEngineers - Find Experts</title>

    <!-- Google Maps API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBHKSYzQp9IEC3JUuYLhg9-fS8wwdSsEYg&libraries=places"></script>

    <style>
        /* ==========================================================================
           SEARCH PAGE EMBEDDED CSS (CUPERTINO / APPLE STYLE)
           ========================================================================== */
        
         :root {
            --sys-blue: #007AFF;
            --sys-blue-hover: #0056b3;
            --sys-bg-light: #F2F2F7;
            --sys-card-bg: rgba(255, 255, 255, 0.75);
            --sys-text-primary: #1C1C1E;
            --sys-text-secondary: #8E8E93;
            --sys-border: rgba(60, 60, 67, 0.1);
            --glass-blur: blur(24px) saturate(180%);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.08);
            --radius-md: 20px;
            --radius-lg: 32px;
            --transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--sys-bg-light);
            color: var(--sys-text-primary);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }
        
        a {
            text-decoration: none;
            color: inherit;
        }
        
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            outline: none;
        }
        
        .app-wrapper {
            display: flex;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            position: relative;
        }
        /* Desktop Sidebar */
        
        .desktop-sidebar {
            width: 280px;
            height: 100vh;
            position: sticky;
            top: 0;
            background: var(--sys-card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-right: 1px solid var(--sys-border);
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }
        
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 48px;
        }
        
        .brand-logo svg {
            width: 32px;
            height: 32px;
            color: var(--sys-blue);
        }
        
        .brand-logo h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }
        
        .nav-link {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 16px;
            border-radius: 12px;
            color: var(--sys-text-secondary);
            font-size: 15px;
            font-weight: 600;
            transition: var(--transition);
        }
        
        .nav-link svg {
            width: 22px;
            height: 22px;
            stroke-width: 2px;
        }
        
        .nav-link:hover {
            background: rgba(0, 0, 0, 0.04);
            color: var(--sys-text-primary);
        }
        
        .nav-link.active {
            background: var(--sys-blue);
            color: #fff;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }
        
        .user-profile-widget {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--sys-border);
            border-radius: var(--radius-md);
            margin-top: auto;
            cursor: pointer;
        }
        
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--sys-blue);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }
        
        .user-info p {
            font-size: 14px;
            font-weight: 600;
        }
        
        .user-info span {
            font-size: 12px;
            color: var(--sys-text-secondary);
        }
        /* Main Content */
        
        .main-content {
            flex: 1;
            padding: 40px 64px;
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        
        .inner-header {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .back-btn {
            background: var(--sys-card-bg);
            border: 1px solid var(--sys-border);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--sys-text-primary);
            cursor: pointer;
            transition: var(--transition);
        }
        
        .back-btn:hover {
            background: #fff;
            transform: translateX(-4px);
        }
        
        .page-title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        /* AI Diagnosis Banner */
        
        #ai-diagnosis-banner {
            background: linear-gradient(135deg, rgba(52, 199, 89, 0.1), rgba(52, 199, 89, 0.02));
            border: 1px solid rgba(52, 199, 89, 0.3);
            border-radius: 16px;
            padding: 20px 24px;
            display: none;
            box-shadow: 0 4px 12px rgba(52, 199, 89, 0.05);
        }
        
        .ai-title {
            font-size: 13px;
            color: #248A3D;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .ai-result {
            font-size: 16px;
            color: var(--sys-text-primary);
            font-weight: 600;
        }
        /* Map Container */
        
        .map-wrapper {
            width: 100%;
            height: 280px;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--sys-border);
            box-shadow: var(--shadow-sm);
            background: var(--sys-card-bg);
            position: relative;
            z-index: 1;
        }
        
        #google-map {
            width: 100%;
            height: 100%;
        }
        
        .map-loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            color: var(--sys-blue);
            font-weight: 600;
            z-index: 10;
        }
        
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(0, 122, 255, 0.2);
            border-top-color: var(--sys-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }
        
        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
        /* Filter Tabs */
        
        .filter-tabs {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
        }
        
        .filter-tabs::-webkit-scrollbar {
            display: none;
        }
        
        .filter-tab {
            background: var(--sys-card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--sys-border);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            color: var(--sys-text-secondary);
            white-space: nowrap;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .filter-tab:hover {
            background: #fff;
            color: var(--sys-text-primary);
        }
        
        .filter-tab.active {
            background: var(--sys-blue);
            color: white;
            border-color: var(--sys-blue);
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }
        /* Experts List */
        
        .experts-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .status-message {
            text-align: center;
            padding: 60px 20px;
            color: var(--sys-text-secondary);
            font-size: 15px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.5);
            border-radius: var(--radius-md);
            border: 1px dashed var(--sys-border);
        }
        /* Skeleton Loaders */
        
        .skeleton-loader {
            animation: skeleton-pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes skeleton-pulse {
            0% {
                opacity: 0.4;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                opacity: 0.4;
            }
        }
        
        .skel-card {
            background: var(--sys-card-bg);
            border: 1px solid var(--sys-border);
            border-radius: var(--radius-md);
            padding: 20px;
            display: flex;
            gap: 16px;
            align-items: center;
        }
        
        .skel-img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.06);
        }
        
        .skel-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .skel-line {
            height: 12px;
            background: rgba(0, 0, 0, 0.06);
            border-radius: 6px;
        }
        /* Dynamic Expert Card Style */
        
        .expert-card {
            background: var(--sys-card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--sys-border);
            border-radius: var(--radius-md);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: var(--shadow-sm);
            text-decoration: none;
            color: inherit;
            transition: var(--transition);
            cursor: pointer;
        }
        
        .expert-card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: var(--shadow-lg);
            background: #fff;
        }
        
        .expert-photo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
            box-shadow: var(--shadow-sm);
        }
        
        .expert-info {
            flex: 1;
        }
        
        .expert-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--sys-text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }
        
        .verified-badge {
            color: #34C759;
        }
        
        .expert-meta {
            font-size: 13px;
            color: var(--sys-text-secondary);
            font-weight: 500;
        }
        
        .expert-rating {
            font-size: 14px;
            font-weight: 600;
            color: #FF9500;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .expert-distance {
            font-size: 13px;
            font-weight: 600;
            color: var(--sys-blue);
            background: rgba(0, 122, 255, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            white-space: nowrap;
        }
        /* Mobile Bottom Nav */
        
        .mobile-bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: var(--glass-blur);
            border-top: 1px solid var(--sys-border);
            padding: 12px 24px 24px;
            z-index: 1000;
        }
        
        @media (max-width: 768px) {
            body {
                padding-bottom: 80px;
            }
            .desktop-sidebar {
                display: none;
            }
            .mobile-bottom-nav {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .mob-nav-item {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px;
                color: var(--sys-text-secondary);
                flex: 1;
            }
            .mob-nav-item svg {
                width: 24px;
                height: 24px;
            }
            .mob-nav-item span {
                font-size: 11px;
                font-weight: 600;
            }
            .mob-nav-item.active {
                color: var(--sys-blue);
            }
            .main-content {
                padding: 24px 16px;
            }
            .map-wrapper {
                height: 220px;
            }
            .expert-card {
                flex-wrap: wrap;
            }
            .expert-distance {
                width: 100%;
                text-align: center;
                margin-top: 8px;
            }
        }
    </style>
</head>

<body>

    <div class="app-wrapper">

        <!-- Sidebar (Desktop) -->
        <aside class="desktop-sidebar">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                </svg>
                <h1>UniEngineers</h1>
            </div>

            <nav class="sidebar-nav">
                <a href="home.html" class="nav-link active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> Dashboard
                </a>
                <a href="tracking.html" class="nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Active Jobs
                </a>
                <a href="vault.html" class="nav-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg> Service Vault
                </a>
            </nav>

            <div class="user-profile-widget" id="btn-logout" title="Click to Logout">
                <div class="avatar" id="avatar-initial">U</div>
                <div class="user-info">
                    <p id="sidebar-user-name">Loading...</p>
                    <span>Premium Member</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <header class="inner-header">
                <button onclick="window.history.back()" class="back-btn" title="Go Back">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                </button>
                <h1 class="page-title" id="dynamic-page-title">Finding Experts...</h1>
            </header>

            <!-- AI Diagnosis Banner -->
            <div id="ai-diagnosis-banner">
                <div class="ai-title">AI Diagnosis</div>
                <div class="ai-result" id="ai-result-text">Analyzing your problem...</div>
            </div>

            <!-- Map View -->
            <div class="map-wrapper">
                <div id="map-loading" class="map-loading-overlay">
                    <div class="spinner"></div>
                    Locating area...
                </div>
                <div id="google-map"></div>
            </div>

            <!-- Filters -->
            <div class="filter-tabs">
                <div class="filter-tab active" data-filter="nearest">📍 Nearest First</div>
                <div class="filter-tab" data-filter="top-rated">⭐ Top Rated</div>
                <div class="filter-tab" data-filter="experienced">🛠 Most Experienced</div>
            </div>

            <!-- Experts List Container (Skeletons initially) -->
            <div id="experts-list" class="experts-container">
                <div class="skeleton-loader skel-card">
                    <div class="skel-img"></div>
                    <div class="skel-info">
                        <div class="skel-line" style="width: 50%; height: 16px;"></div>
                        <div class="skel-line" style="width: 30%;"></div>
                        <div class="skel-line" style="width: 40%;"></div>
                    </div>
                </div>
                <div class="skeleton-loader skel-card">
                    <div class="skel-img"></div>
                    <div class="skel-info">
                        <div class="skel-line" style="width: 60%; height: 16px;"></div>
                        <div class="skel-line" style="width: 40%;"></div>
                        <div class="skel-line" style="width: 35%;"></div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Mobile Bottom Nav -->
    <nav class="mobile-bottom-nav">
        <a href="home.html" class="mob-nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
        </a>
        <a href="tracking.html" class="mob-nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>Track</span>
        </a>
        <a href="vault.html" class="mob-nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            <span>Vault</span>
        </a>
    </nav>

    <!-- Page Logic Script -->
    <script type="module" src="search.js"></script>
</body>

</html>
